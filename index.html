<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bearing Collective</title>
<meta name="description" content="Can five plants learn bearing faults together without sharing data? Thirteen simple questions, each answered by the real results.">
<meta name="theme-color" content="#f7f8fc">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%231f4fd8' stroke-width='10'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%231f4fd8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f7f8fc;--card:#fff;--card2:#eef1f9;--ink:#0b1220;--muted:#5b6478;--soft:#8a93a6;--line:#e4e8f1;
  --accent:#1f4fd8;--accent2:#5b45e0;--steel:#9aa6ba;--amber:#e07b24;--good:#10a37f;--bad:#e5484d;
  --serif:"Instrument Serif",Georgia,serif;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}a{color:inherit}

#covervid{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:100% 30%;transition:opacity 1s}
body:not(.cover) #covervid{opacity:0}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 1s;
  background:linear-gradient(90deg,rgba(247,248,252,.97) 0%,rgba(247,248,252,.88) 34%,rgba(247,248,252,.2) 62%,rgba(247,248,252,0) 80%)}
body:not(.cover) .veil{opacity:0}
@media (max-width:860px){.veil{background:linear-gradient(0deg,rgba(247,248,252,1) 0%,rgba(247,248,252,.95) 48%,rgba(247,248,252,.3) 75%,rgba(247,248,252,0) 100%)}}

/* ---------- frame ---------- */
#stage{position:fixed;inset:0;z-index:2}
.q{position:absolute;inset:0;display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:5vw;align-items:center;padding:86px 6vw 110px;
  opacity:0;visibility:hidden;transform:translateX(100px);transition:opacity .7s,transform .9s var(--ease),visibility 0s .9s}
.q.past{transform:translateX(-100px)}
.q.active{opacity:1;visibility:visible;transform:none;transition:opacity .7s,transform .9s var(--ease),visibility 0s}
@media (max-width:860px){.q{display:block;overflow-y:auto;overflow-x:hidden;padding:64px 18px 120px}.q .right{margin-top:20px}}
.num{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.num b{color:var(--accent)}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.3vw,64px);line-height:1;letter-spacing:-.01em;margin:14px 0 22px}
h2 em{font-style:italic;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.05em}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{padding:13px 20px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:#e8f7f2;color:#0b6b52}
.choice.wrong{border-color:var(--bad);background:#fdeced;color:#a3272b}
.choice.dim{opacity:.45}
.skip{display:inline-block;margin-top:14px;font-size:13px;color:var(--soft);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.q.answered .skip{display:none}
.answer{margin-top:22px;padding:20px 22px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px -24px rgba(11,18,32,.25);display:none;animation:ansin .7s var(--ease) both}
.q.answered .answer{display:block}
@keyframes ansin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.answer .verdict{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}.verdict.info{color:var(--accent)}
.answer p{margin:0;font-size:15px;line-height:1.55;color:var(--muted)}
.answer p b{color:var(--ink)}
.answer .big{font-family:var(--serif);font-size:44px;line-height:1;margin:2px 0 8px;color:var(--ink)}

/* the slide is the answer: blurred until you answer */
.vis{position:relative;padding:28px;background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:26px;box-shadow:0 30px 80px rgba(11,18,32,.12),0 0 0 1px rgba(31,79,216,.05)}
.vis .inner{transition:filter .9s var(--ease),opacity .9s}
.vis.locked .inner{filter:blur(14px) saturate(.4);opacity:.45;pointer-events:none;user-select:none}
.vis .lock{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .5s;pointer-events:none}
.vis .lock span{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(11,18,32,.1)}
.vis .lock span::before{content:"?";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700}
.vis:not(.locked) .lock{opacity:0}
.vis h4{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.04em}
.vis .cap{font-size:12px;color:var(--soft);margin-top:14px}
@media (max-width:860px){.vis{padding:16px;border-radius:20px}}

/* visuals */
.hbar{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:12px;margin:12px 0}
.hbar .k{font-size:13px;color:var(--muted)}
.hbar .t{height:22px;border-radius:11px;background:var(--card2);overflow:hidden}
.hbar .f{height:100%;width:0;border-radius:11px;transition:width 1.4s var(--ease)}
.hbar .v{font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.grp{margin-bottom:14px}.grp>.gl{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}
.dots{display:grid;gap:6px}
.dots i{aspect-ratio:1;border-radius:5px;background:var(--line);transition:background .35s}
.mini{font-size:14px;color:var(--muted);margin-top:14px}.mini b{color:var(--ink)}
.plants{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pl{background:var(--card2);border-radius:16px;padding:14px 6px;text-align:center}
.pl .id{font-family:var(--serif);font-size:40px;line-height:1}
.pl .hp{font-size:11px;color:var(--soft);margin:2px 0 10px}
.pl .fd{width:18px;height:18px;border-radius:6px;margin:6px auto;border:2px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}
.mat{display:grid;grid-template-columns:86px repeat(4,1fr);gap:4px;font-size:11px;color:var(--soft)}
.mat .c{height:17px;border-radius:4px;background:var(--line);transition:background .3s}
.mat .h{text-align:center}
.tabs{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,18,32,.1)}
.heat{display:grid;grid-template-columns:34px repeat(4,1fr);gap:6px}
.heat .h{font-size:11px;color:var(--soft);text-align:center}
.heat .p{font-family:var(--serif);font-size:24px;display:flex;align-items:center}
.heat .c{border-radius:10px;height:42px;display:grid;place-items:center;font-weight:700;font-size:13px;transition:background .5s}
svg.chart{width:100%;height:auto;overflow:visible}
.ax{font:11px Inter,sans-serif;fill:var(--soft)}
.lims{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lim{background:var(--card2);border-radius:16px;padding:16px}
.lim b{display:block;font-size:14px;margin-bottom:2px}.lim span{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .hbar{grid-template-columns:60px 1fr 54px;margin:7px 0}.hbar .t{height:16px}
  .pl .id{font-size:28px}.pl .fd{width:14px;height:14px;margin:4px auto}
  .heat .c{height:30px;font-size:11px}.heat .p{font-size:18px}
  .mat .c{height:10px}.mat{grid-template-columns:70px repeat(4,1fr);font-size:10px}.lim{padding:10px}
}

/* chrome */
.top{position:fixed;z-index:3;top:calc(18px + env(safe-area-inset-top));left:6vw;right:6vw;display:flex;align-items:center;justify-content:space-between;gap:16px;transition:opacity .5s}
.dotsbar{display:flex;gap:5px}
.dotsbar i{width:18px;height:4px;border-radius:2px;background:#dfe4ee;transition:all .4s}
.dotsbar i.done{background:var(--ink)}.dotsbar i.cur{background:var(--accent);width:34px}
.score{font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.nav{position:fixed;z-index:3;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:6px;border-radius:999px;
  background:rgba(255,255,255,.88);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(11,18,32,.08);transition:opacity .5s}
.nav button{white-space:nowrap;border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:14px;cursor:pointer;background:transparent}
.nav #nextb{background:var(--ink);color:#fff}
.nav #nextb.ready{animation:nudge 1.4s infinite}
@keyframes nudge{50%{box-shadow:0 0 0 7px rgba(31,79,216,.18)}}
body.cover .top,body.cover .nav{opacity:0;pointer-events:none}
@media (max-width:860px){.dotsbar i{width:10px}.dotsbar i.cur{width:20px}.top{left:16px;right:16px}}
.credit{position:fixed;z-index:3;right:12px;bottom:6px;font-size:10px;color:var(--muted);opacity:.8}
.credit a{text-decoration:none}

/* cover + final */
.cover{grid-template-columns:1fr}
@media (max-width:860px){.q.cover{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:56px}}
.cover .inner{max-width:620px}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(58px,9vw,140px);line-height:.95;margin:14px 0 18px;letter-spacing:-.015em}
.cover h1 em{font-style:italic;color:var(--accent)}
.cover p{font-size:18px;color:var(--muted);margin:0 0 30px;max-width:460px;line-height:1.5}
.go{position:relative;padding:18px 30px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 18px 44px rgba(11,18,32,.22)}
.go::before{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid rgba(31,79,216,.3);animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.96);opacity:1}100%{transform:scale(1.12);opacity:0}}
.final .bigscore{font-family:var(--serif);font-size:clamp(80px,10vw,140px);line-height:1;color:var(--accent)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.links a{padding:11px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:600}
.links a:hover{border-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body class="cover">
<video id="covervid" autoplay muted loop playsinline preload="auto" poster="video/hero-poster.jpg" aria-hidden="true">
  <source src="video/hero.webm" type="video/webm"><source src="video/hero.mp4" type="video/mp4"></video>
<div class="veil"></div>
<div id="stage"></div>
<div class="top"><div class="dotsbar" id="dots"></div><div class="score" id="score">Score 0 / 0</div></div>
<div class="nav"><button id="backb">‹ Back</button><button id="nextb">Next question ›</button></div>
<div class="credit">Data: <a href="https://engineering.case.edu/bearingdatacenter" target="_blank" rel="noopener">CWRU Bearing Data Center</a> · Built on <a href="https://flower.ai" target="_blank" rel="noopener">Flower</a></div>

<script src="data.js"></script>
<script>
const D = window.DATA, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const M = ['Local-only', 'Federated', 'Personalized FL', 'Centralized'];
const ML = ['Alone', 'Flower', 'Personal', 'Pooled'];
const MC = ['var(--steel)', 'var(--accent)', '#7d94ee', 'var(--ink)'];
// exact: 100% only when every test window was right; otherwise two decimals, never rounded up to 100
const pct = v => (v === 100 ? '100' : (Math.floor(v * 100) / 100).toFixed(2)) + '%';
const raf2 = f => requestAnimationFrame(() => requestAnimationFrame(f));

/* ---------- chart builders (all numbers from the 45 Flower runs in data.js) ---------- */
function hbars(rows, max = 100) {
  return rows.map(([k, v, c, lab]) => `<div class="hbar"><span class="k">${k}</span><div class="t"><div class="f" data-w="${(v / max * 100).toFixed(2)}" style="background:${c}"></div></div><span class="v" style="color:${c === 'var(--steel)' ? 'var(--muted)' : c}">${lab ?? pct(v)}</span></div>`).join('');
}
function playBars(el) {
  $$('.f', el).forEach(f => { f.style.transition = 'none'; f.style.width = 0; });
  raf2(() => $$('.f', el).forEach((f, i) => { f.style.transition = `width 1.4s var(--ease) ${.3 + i * .12}s`; f.style.width = f.dataset.w + '%'; }));
}
function lineSVG({ w, h, pad, xs, series, ymin, ymax, yticks, xticks, xlab, ylog, ref }) {
  const yf = v => ylog ? Math.log10(v) : v;
  const X = v => pad.l + (v - xs[0]) / (xs[xs.length - 1] - xs[0]) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (yf(v) - yf(ymin)) / (yf(ymax) - yf(ymin)) * (h - pad.t - pad.b);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">`;
  yticks.forEach(([v, l]) => s += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text class="ax" x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end">${l}</text>`);
  (xticks || xs).forEach(v => s += `<text class="ax" x="${X(v)}" y="${h - pad.b + 18}" text-anchor="middle">${v}</text>`);
  if (xlab) s += `<text class="ax" x="${w - pad.r}" y="${h - 2}" text-anchor="end">${xlab}</text>`;
  if (ref) s += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(ref.v)}" y2="${Y(ref.v)}" stroke="var(--steel)" stroke-width="2" stroke-dasharray="6 6"/><text class="ax" x="${w - pad.r}" y="${Y(ref.v) - 8}" text-anchor="end">${ref.label}</text>`;
  series.forEach(({ ys, color, width = 3, area }) => {
    const d = ys.map((v, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    if (area) s += `<path d="${d} L${X(xs[xs.length - 1])},${h - pad.b} L${X(xs[0])},${h - pad.b} Z" fill="${color}" opacity=".08"/>`;
    s += `<path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  return s + '</svg>';
}
function playLines(el) {
  $$('path.draw', el).forEach((p, i) => {
    const L = p.getTotalLength();
    p.style.transition = 'none'; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    raf2(() => { p.style.transition = `stroke-dashoffset 2.2s cubic-bezier(.3,.7,.2,1) ${.3 + i * .15}s`; p.style.strokeDashoffset = 0; });
  });
}
const dotsHTML = (n, cols) => `<div class="dots" style="grid-template-columns:repeat(${cols},1fr)">${'<i></i>'.repeat(n)}</div>`;
function playDots(el, before, after) {
  const cells = $$('.dots i', el), cols = parseInt($('.dots', el).style.gridTemplateColumns.match(/\d+/)[0]);
  cells.forEach((c, i) => c.style.background = i < before ? 'var(--steel)' : 'var(--line)');
  const order = cells.map((c, i) => [i, (i % cols) * 100 + Math.floor(i / cols)]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  let k = 0; setTimeout(() => order.forEach(i => { if (i < after) setTimeout(() => cells[i].style.background = 'var(--accent)', (k++) * 55); }), 900);
}
const FAULTS = [['Normal', 'var(--good)'], ['Inner race', 'var(--accent)'], ['Outer race', 'var(--amber)'], ['Ball', 'var(--ink)']];
const PLANTS = [['A', '0 HP', [1, 1, 0, 1]], ['B', '1 HP', [1, 1, 1, 0]], ['C', '2 HP', [1, 0, 0, 1]], ['D', '3 HP', [1, 0, 1, 0]], ['E', 'new', [1, 0, 0, 0]]];

const V = {
  plants: { html: `<div class="plants">${PLANTS.map(([id, hp, has]) => `<div class="pl"><div class="id">${id}</div><div class="hp">${hp}</div>${has.map((h, j) => `<div class="fd" data-c="${h ? FAULTS[j][1] : ''}"></div>`).join('')}</div>`).join('')}</div>
      <div class="legend">${FAULTS.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}<span><i style="border:2px solid var(--line)"></i>never seen</span></div>`,
    play(el) { const fds = $$('.fd', el); fds.forEach(f => { f.style.transition = 'none'; f.style.background = 'transparent'; f.style.borderColor = 'var(--line)'; });
      raf2(() => fds.forEach((f, i) => { if (!f.dataset.c) return; const col = Math.floor(i / 4); f.style.transition = `background .4s ${.3 + col * .25 + (i % 4) * .06}s, border-color .4s ${.3 + col * .25}s`; f.style.background = f.dataset.c; f.style.borderColor = f.dataset.c; })); } },
  data: (() => {
    const rows = ['Normal', 'Inner .007', 'Inner .014', 'Inner .021', 'Outer .007', 'Outer .014', 'Outer .021', 'Ball .007', 'Ball .014', 'Ball .021'];
    let h = '<div class="mat"><span></span>' + ['0 HP', '1 HP', '2 HP', '3 HP'].map(x => `<span class="h">${x}</span>`).join('');
    rows.forEach(r => { h += `<span>${r}</span>` + [0, 1, 2, 3].map(c => `<i class="c" data-col="${c}" data-held="${r.endsWith('.021') ? 1 : ''}"></i>`).join(''); });
    h += '</div><div class="legend"><span><i style="background:var(--accent)"></i>train / test</span><span><i style="background:var(--amber)"></i>.021″ held back for the unseen-size test</span></div>';
    return { html: h, play(el) { const cs = $$('.c', el); cs.forEach(c => { c.style.transition = 'none'; c.style.background = 'var(--line)'; });
      raf2(() => cs.forEach(c => { c.style.transition = `background .35s ${.3 + (+c.dataset.col) * .3 + Math.random() * .2}s`; c.style.background = c.dataset.held ? 'var(--amber)' : 'var(--accent)'; })); } };
  })(),
  share: (() => {
    const c = D.comm, raw = c.centralized_unique_raw_bytes_float32, fl = c.total_fl_model_payload_bytes;
    let s = '<svg class="chart" viewBox="0 0 520 210">'; const pts = [[60, 50], [60, 160], [460, 50], [460, 160]], C = [260, 105];
    pts.forEach(([x, y], i) => {
      s += `<line x1="${x}" y1="${y}" x2="${C[0]}" y2="${C[1]}" stroke="#c9d6fa" stroke-width="2" stroke-dasharray="4 6"/>`;
      s += `<circle r="6" fill="var(--accent)"><animateMotion dur="2.4s" repeatCount="indefinite" begin="${i * .6}s" path="M${x},${y} L${C[0]},${C[1]}"/></circle>`;
      s += `<circle r="5" fill="#7d94ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="${1.2 + i * .6}s" path="M${C[0]},${C[1]} L${x},${y}"/></circle>`;
      s += `<rect x="${x - 38}" y="${y - 24}" width="76" height="48" rx="14" fill="#fff" stroke="var(--line)"/><text x="${x}" y="${y + 9}" text-anchor="middle" font-family="Instrument Serif" font-size="28" fill="var(--ink)">${'ABCD'[i]}</text>`;
    });
    s += `<circle cx="${C[0]}" cy="${C[1]}" r="44" fill="var(--accent)" opacity=".08"/><circle cx="${C[0]}" cy="${C[1]}" r="30" fill="var(--accent)"/><text x="${C[0]}" y="${C[1] + 5}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter">Flower</text></svg>`;
    return { html: s + `<div style="margin-top:10px">${hbars([['Raw data', 100, 'var(--steel)', (raw / 1e6).toFixed(2) + ' MB'], ['Updates', fl / raw * 100, 'var(--accent)', (fl / 1e6).toFixed(2) + ' MB']])}</div><div class="cap">Measured: all 30 rounds of model traffic vs. one upload of the raw training signal.</div>`, play: playBars };
  })(),
  curve: (() => { const ys = D.scenarios.baseline.fl_curve, xs = ys.map((_, i) => i + 1), loc = D.scenarios.baseline.members['Local-only'];
    return { html: `<h4>Shared-model accuracy · plants A–D</h4>` + lineSVG({ w: 540, h: 280, pad: { l: 44, r: 10, t: 14, b: 34 }, xs, xticks: [1, 5, 10, 15, 20, 25, 30], xlab: 'round',
      series: [{ ys, color: 'var(--accent)', width: 4, area: true }], ymin: 40, ymax: 100, yticks: [[40, '40%'], [60, '60%'], [80, '80%'], [100, '100%']], ref: { v: loc, label: 'each plant alone · ' + pct(loc) } }) + `<div class="cap">Round 1: ${pct(ys[0])} · Round 4: ${pct(ys[3])} · mean of five seeds</div>`, play: playLines }; })(),
  result: { html: `<h4>Baseline test · average of plants A–D</h4>` + hbars(M.map((m, i) => [ML[i], D.scenarios.baseline.members[m], MC[i]])) + `<div class="cap">Flower: <b>1,540 of 1,540</b> test windows correct (308 per run × 5 seeds). “Alone” is the average of the four plants’ own scores.</div>`, play: playBars },
  plantC: { html: `<h4>Plant C · outer-race fault windows</h4>${dotsHTML(14, 7)}<div class="mini">Alone <b>0 / 14</b> → with Flower <b style="color:var(--accent)">14 / 14</b></div>`, play: el => playDots(el, 0, 14) },
  plantE: { html: `<h4>Plant E · four-class test on day one</h4>${dotsHTML(32, 8)}<div class="mini">Alone <b>8 / 32</b> → with Flower <b style="color:var(--accent)">32 / 32</b></div>`, play: el => playDots(el, 8, 32) },
  heat: (() => {
    const keys = Object.keys(D.scenarios);
    const color = v => `color-mix(in srgb, var(--accent) ${Math.round(Math.max(0, Math.min(1, (v - 20) / 80)) * 100)}%, #fff)`;
    const grid = k => { const s = D.scenarios[k]; let h = '<span></span>' + ML.map(x => `<span class="h">${x}</span>`).join('');
      for (const p of 'ABCDE') h += `<span class="p">${p}</span>` + M.map(m => { const v = s.plants[p][m]; return `<span class="c" style="background:${color(v)};color:${v > 62 ? '#fff' : 'var(--ink)'}">${pct(v)}</span>`; }).join(''); return h; };
    return { html: `<div class="tabs">${keys.map((k, i) => `<button data-k="${k}" class="${i ? '' : 'on'}">${D.scenarios[k].label}</button>`).join('')}</div><div class="heat">${grid(keys[0])}</div><div class="cap">Accuracy per plant · mean of five seeds · tap a test</div>`,
      play(el) { const tabs = $('.tabs', el); if (tabs.dataset.wired) return; tabs.dataset.wired = 1;
        tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$('button', tabs).forEach(x => x.classList.toggle('on', x === b)); $('.heat', el).innerHTML = grid(b.dataset.k); }); } };
  })(),
  noise: (() => { const sw = D.sweep, xs = sw.map(r => r.snr);
    return { html: `<h4>Accuracy vs. sensor noise</h4>` + lineSVG({ w: 540, h: 260, pad: { l: 44, r: 10, t: 14, b: 34 }, xs, xlab: 'SNR, dB (left = noisier)',
      series: M.map((m, i) => ({ ys: sw.map(r => r[m]), color: MC[i], width: i === 1 ? 4 : 2.5 })), ymin: 50, ymax: 102, yticks: [[50, '50%'], [75, '75%'], [100, '100%']] })
      + `<div class="legend">${M.map((m, i) => `<span><i style="background:${MC[i]}"></i>${ML[i]}</span>`).join('')}</div>`, play: playLines }; })(),
  fail: { html: `<h4>Unseen fault size (.021″) · average of plants A–D</h4>` + hbars(M.map((m, i) => [ML[i], D.scenarios.unseen_severity.members[m], ['var(--steel)', 'var(--amber)', '#efa462', 'var(--ink)'][i]])) + `<div class="mini">Plant C outer-race hits: <b>0 / 350</b> with every method.</div>`, play: playBars },
  prox: (() => { const g = Object.entries(D.fedprox).map(([k, f]) => `<div class="grp"><div class="gl">${D.scenarios[k].label}</div>${hbars([['FedAvg', f.fedavg, 'var(--accent)'], ['FedProx', f.fedprox, '#7d94ee']])}</div>`).join('');
    return { html: g + `<div class="cap">μ = 0.1 fixed before the runs · five seeds each</div>`, play: playBars }; })(),
  scale: (() => { const p = D.proj;
    return { html: `<h4>Cumulative bytes over 30 days · log scale</h4>` + lineSVG({ w: 540, h: 270, pad: { l: 54, r: 10, t: 14, b: 34 }, xs: p.days, xticks: [1, 10, 20, 30], xlab: 'day', ylog: true,
      series: [{ ys: p.raw_cumulative_bytes, color: 'var(--steel)', width: 4 }, { ys: p.fl_cumulative_bytes, color: 'var(--accent)', width: 4 }], ymin: 1e4, ymax: 1e14,
      yticks: [[1e4, '10 KB'], [1e6, '1 MB'], [1e9, '1 GB'], [1e12, '1 TB'], [1e14, '100 TB']] })
      + `<div class="legend"><span><i style="background:var(--steel)"></i>Raw stream · 31.1 TB</span><span><i style="background:var(--accent)"></i>Model updates · 0.56 MB</span></div><div class="cap">Projection: 5 plants × 50 sensors × 12 kHz, 1 round a day. Not measured.</div>`, play: playLines }; })(),
  limits: { html: `<div class="lims">${[['One lab rig', 'Not independent machines'], ['Seeded damage', 'Not natural wear'], ['No field pilot', 'No warning-time claims'], ['No formal privacy', 'No secure aggregation or DP']].map(([b, s]) => `<div class="lim"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`, play() {} }
};

/* ---------- the questions: simple question → guess → the chart is the answer ---------- */
const base = D.scenarios.baseline.members, sev = D.scenarios.unseen_severity.members;
const Q = [
  { q: 'Can one plant learn <em>every</em> bearing fault on its own?', c: ['Yes', 'No'], a: 1, vis: 'plants',
    big: 'No', why: 'Each plant has seen only <b>some</b> kinds of failure. Plant C never saw an outer-race fault; new Plant E has seen <b>no faults at all</b>.' },
  { q: 'Is the data <em>real</em> or simulated?', c: ['Real', 'Simulated'], a: 0, vis: 'data',
    big: '40 real files', why: 'Real vibration from the <b>Case Western Reserve University</b> bearing lab: one rig, four loads, healthy and damaged bearings. The largest fault size is kept back for a harder test.' },
  { q: 'Do the plants have to <em>share</em> their raw data?', c: ['Yes', 'No'], a: 1, vis: 'share',
    big: 'No · −69%', why: 'Only <b>model updates</b> travel through Flower. The raw signals stay at each plant, and the traffic is 69% smaller than uploading the data.' },
  { q: 'How many rounds until the shared model is <em>good</em>?', c: ['About 4', 'About 30', 'About 100'], a: 0, vis: 'curve',
    big: '4 rounds', why: `From a coin flip (${pct(D.scenarios.baseline.fl_curve[0])}) to <b>${pct(D.scenarios.baseline.fl_curve[3])}</b> by round 4.` },
  { q: 'Does learning together beat learning <em>alone</em>?', c: ['Yes, by a lot', 'A little', 'No'], a: 0, vis: 'result',
    big: `${pct(base['Local-only'])} → ${pct(base.Federated)}`, why: 'Average plant accuracy on the baseline test. The 100% is exact: <b>1,540 of 1,540</b> test windows right across five seeds, the same as pooling all the data in one place.' },
  { q: 'Can a plant catch a fault it has <em>never</em> seen?', c: ['Yes', 'No'], a: 0, vis: 'plantC',
    big: '0 → 14 of 14', why: 'Plant C had no outer-race examples. After Flower training it caught <b>every one</b>, learned from plants B and D.' },
  { q: 'Can a <em>brand-new</em> plant be useful on day one?', c: ['Yes', 'No'], a: 0, vis: 'plantE',
    big: '8 → 32 of 32', why: 'Plant E joined with healthy data only. It downloads the shared model and gets <b>all 32</b> test windows right.' },
  { q: 'Does it work for <em>every</em> plant in every test?', c: ['Yes', 'No'], a: 1, vis: 'heat',
    big: 'Not every test', why: 'Baseline and noisy sensors: near 100% for every plant. The <b>unseen fault size</b> test is the weak spot. Tap the tabs to see it.' },
  { q: 'Does sensor <em>noise</em> break it?', c: ['Yes', 'No'], a: 1, vis: 'noise',
    big: `${pct(D.sweep[0].Federated)} at 0 dB`, why: 'Even at the noisiest level the shared model stays near 99%. Alone, plants stay stuck at 56%, because they are missing fault types, not because of noise.' },
  { q: 'Can it spot a <em>bigger</em> fault size it never trained on?', c: ['Yes', 'No'], a: 1, vis: 'fail',
    big: `${pct(sev.Federated)}`, why: 'Trained on small pits, tested on a larger one: <b>every method fails</b>, even pooling all the data. Reported, not hidden.' },
  { q: 'Does a fancier algorithm, <em>FedProx</em>, help?', c: ['Yes', 'No'], a: 1, vis: 'prox',
    big: 'No gain', why: 'Same data, same seeds, one extra term. FedProx scores the same as plain FedAvg, or slightly lower.' },
  { q: 'Over a month, what travels: <em>terabytes</em> or megabytes?', c: ['Terabytes', 'Megabytes'], a: 1, vis: 'scale',
    big: '0.56 MB vs 31 TB', why: 'Five plants, fifty sensors each: streaming raw vibration is 31 terabytes. Model updates are under a megabyte. A projection, not a measurement.' },
  { q: 'Is it ready for a <em>real</em> factory?', c: ['Yes', 'Not yet'], a: 1, vis: 'limits',
    big: 'Not yet', why: 'It proves the <b>method</b> on clean lab data. A factory has other machines, natural wear and changing speeds. Next step: a real pilot.' }
];

/* ---------- build + navigation ---------- */
let score = 0, answered = 0, cur = 0;
const S = [{ cover: true }, ...Q, { final: true }], LAST = S.length - 1;
const setScore = () => $('#score').textContent = `Score ${score} / ${answered}`;
function reveal(q, verdict) {
  const v = $('.vis', q.el); v.classList.remove('locked');
  $('.answer', q.el).innerHTML = `<div class="verdict ${verdict}">${verdict === 'ok' ? 'Correct' : verdict === 'no' ? 'Not quite' : 'The answer'}</div><div class="big">${q.big}</div><p>${q.why}</p>`;
  q.el.classList.add('answered'); q.done = true; $('#nextb').classList.add('ready');
  V[q.vis].play($('.inner', v));
}
function build() {
  S.forEach((q, i) => {
    const el = document.createElement('section'); el.className = 'q' + (q.cover ? ' cover' : '');
    if (q.cover) el.innerHTML = `<div class="inner"><div class="num"><b>Federated learning</b> · ${Q.length} simple questions</div>
        <h1>Bearing <em>Collective</em></h1><p>Can five plants learn bearing faults together without sharing their data? Guess, then see the real results.</p>
        <button class="go" id="start">Start</button></div>`;
    else if (q.final) el.innerHTML = `<div class="final"><div class="num"><b>Done</b></div><h2>You scored</h2><div class="bigscore" id="fs"></div>
        <p style="color:var(--muted);max-width:420px;line-height:1.5">Five virtual plants, one shared model, 45 Flower simulations. A strong lab result with an honest weak spot.</p>
        <div class="links"><a href="https://flower.ai" target="_blank" rel="noopener">Flower ↗</a><a href="https://engineering.case.edu/bearingdatacenter" target="_blank" rel="noopener">CWRU data ↗</a><a href="#" id="again">↺ Start again</a></div></div>
        <div class="right"><div class="vis"><div class="inner">${hbars(M.map((m, i) => [ML[i], base[m], MC[i]]))}<div class="cap">Baseline accuracy, the headline result · Flower: 1,540 of 1,540 windows correct.</div></div></div></div>`;
    else el.innerHTML = `<div class="left"><div class="num"><b>Question ${String(i).padStart(2, '0')}</b> / ${Q.length}</div><h2>${q.q}</h2>
        <div class="choices">${q.c.map((o, k) => `<button class="choice" data-i="${k}">${o}</button>`).join('')}</div>
        <button class="skip">Just show me</button><div class="answer"></div></div>
        <div class="right"><div class="vis locked"><div class="inner">${V[q.vis].html}</div><div class="lock"><span>Answer to reveal</span></div></div></div>`;
    $('#stage').appendChild(el); q.el = el;
    if (!q.cover && !q.final) {
      $('.choices', el).addEventListener('click', e => {
        const b = e.target.closest('.choice'); if (!b || q.done) return;
        const k = +b.dataset.i, ok = k === q.a;
        $$('.choice', el).forEach((x, j) => { x.disabled = true; x.classList.add(j === q.a ? 'right' : j === k ? 'wrong' : 'dim'); });
        answered++; if (ok) score++; setScore(); reveal(q, ok ? 'ok' : 'no');
      });
      $('.skip', el).addEventListener('click', () => { if (q.done) return; $$('.choice', el).forEach((x, j) => { x.disabled = true; x.classList.add(j === q.a ? 'right' : 'dim'); }); reveal(q, 'info'); });
    }
  });
  $('#dots').innerHTML = Q.map(() => '<i></i>').join('');
  $('#start').onclick = () => go(1);
  $('#again').onclick = e => { e.preventDefault(); location.reload(); };
}
function go(i) {
  i = Math.max(0, Math.min(LAST, i)); cur = i;
  S.forEach((q, k) => { q.el.classList.toggle('active', k === i); q.el.classList.toggle('past', k < i); });
  document.body.classList.toggle('cover', i === 0);
  $$('#dots i').forEach((d, k) => d.className = k + 1 === i ? 'cur' : S[k + 1].done ? 'done' : '');
  $('#nextb').textContent = i === LAST - 1 ? 'See my score ›' : 'Next question ›';
  $('#nextb').classList.toggle('ready', !!S[i].done);
  $('#nextb').style.display = i === LAST ? 'none' : '';
  if (S[i].final) { $('#fs').textContent = `${score} / ${answered}`; playBars(S[i].el); }
}
$('#nextb').onclick = () => go(cur + 1);
$('#backb').onclick = () => go(cur - 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1); });
build(); go(0);
if (matchMedia('(prefers-reduced-motion: reduce)').matches) $('#covervid').pause();
</script>
</body>
</html>
