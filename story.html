<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bearing Collective</title>
<meta name="description" content="Five plants learn bearing faults together with Flower, told as a horizontal story.">
<meta name="theme-color" content="#f7f8fc">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%231f4fd8' stroke-width='10'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%231f4fd8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f7f8fc;--card:#fff;--card2:#eef1f9;--ink:#0b1220;--muted:#5b6478;--soft:#8a93a6;
  --accent:#1f4fd8;--accent2:#5b45e0;--steel:#9aa6ba;--amber:#e07b24;--good:#10b981;
  --line:#e4e8f1;--dur:12s;--serif:"Instrument Serif",Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
a{color:inherit}

/* ---------- horizontal panorama (pans left → right through the story) ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:0;transition:opacity 1.2s}
#world .layer{position:absolute;top:0;left:0;height:100%;will-change:transform;transition:transform 2.6s cubic-bezier(.45,.05,.2,1)}
#world svg{display:block;width:100%;height:100%}
.flow{animation:flow 6s linear infinite}
@keyframes flow{to{transform:translateX(-300px)}}
#covervid{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:100% 30%;transition:opacity 1.2s}
body:not(.cover) #covervid{opacity:0} body:not(.cover) #world{opacity:1}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(247,248,252,.97) 0%,rgba(247,248,252,.9) 32%,rgba(247,248,252,.35) 58%,rgba(247,248,252,0) 80%)}
@media (max-width:820px){
  .veil{background:linear-gradient(0deg,rgba(247,248,252,1) 0%,rgba(247,248,252,.95) 42%,rgba(247,248,252,.55) 62%,rgba(247,248,252,.2) 100%)}
}

/* ---------- slides ---------- */
#stage{position:fixed;inset:0;z-index:2;cursor:pointer;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(90px);
  transition:opacity .8s ease,transform 1s var(--ease),visibility 0s 1s}
.slide.past{transform:translateX(-90px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .8s ease,transform 1s var(--ease),visibility 0s}
.content{position:absolute;left:max(7vw,24px);top:50%;transform:translateY(-50%);width:min(520px,40vw)}
.vis{position:absolute;right:max(5vw,24px);top:50%;transform:translateY(-50%);width:min(600px,44vw);padding:28px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:26px;
  box-shadow:0 30px 80px rgba(11,18,32,.12),0 0 0 1px rgba(31,79,216,.05)}
.vis .cap{font-size:12px;color:var(--soft);margin-top:14px}
.vis h4{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media (max-width:820px){
  .content{left:22px;right:22px;width:auto;top:auto;bottom:calc(92px + env(safe-area-inset-bottom));transform:none}
  .vis{left:16px;right:16px;width:auto;top:calc(54px + env(safe-area-inset-top));transform:none;padding:16px;border-radius:20px}
}

/* entrance: everything moves sideways */
.r,.title .w{opacity:0}
.slide.active .r{animation:slidein .95s var(--ease) both;animation-delay:calc(.25s + var(--d,0)*.12s)}
.title .w{display:inline-block;margin-right:.2em}
.slide.active .title .w{animation:slidein 1.05s var(--ease) both;animation-delay:calc(.4s + var(--i)*.09s)}
.slide.active .vis{animation:visin 1.2s var(--ease) .35s both}
@keyframes slidein{from{opacity:0;transform:translateX(44px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes visin{from{opacity:0;translate:120px 0}to{opacity:1;translate:0 0}}

.art{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;margin-bottom:22px;overflow:hidden;
  background:rgba(255,255,255,.85);border:1px solid #fff;box-shadow:0 24px 60px rgba(31,79,216,.18),inset 0 0 0 1px rgba(31,79,216,.06)}
.art img{width:100%;height:100%;object-fit:cover}
.slide.active .art img{animation:pan 9s ease-out both}
@keyframes pan{from{transform:scale(1.25) translateX(14px)}to{transform:scale(1.1) translateX(-6px)}}
.art svg{width:50%;height:50%;fill:none;stroke:url(#ig);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:820px){.art{display:none}}

.ch{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.ch em{font-style:normal;color:var(--muted);letter-spacing:.12em}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(42px,6.4vw,96px);line-height:.96;letter-spacing:-.015em;margin:12px 0 16px}
.title .acc{font-style:italic;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.title .acc.warn{background:linear-gradient(90deg,var(--amber),#c2410c);-webkit-background-clip:text;background-clip:text}
.line{font-size:clamp(15px,1.4vw,18px);color:var(--muted);margin:0 0 22px;line-height:1.5;max-width:440px}
.stat{display:flex;align-items:baseline;gap:14px}
.stat b{font-family:var(--serif);font-weight:400;font-size:clamp(48px,5.6vw,78px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(90deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:14px;line-height:1.35;max-width:200px}
@media (max-width:820px){.title{font-size:clamp(38px,11vw,56px);margin:8px 0 10px}.line{margin-bottom:14px}.stat b{font-size:44px}}

.bigword{position:absolute;left:4vw;bottom:4vh;font-family:var(--serif);font-size:clamp(120px,20vw,320px);line-height:.8;white-space:nowrap;pointer-events:none;
  color:transparent;-webkit-text-stroke:1.5px rgba(31,79,216,.14);opacity:0}
.slide.active .bigword{animation:drift 3.2s var(--ease) .1s both}
@keyframes drift{from{opacity:0;transform:translateX(18vw)}to{opacity:1;transform:none}}
@media (max-width:820px){.bigword{display:none}}

/* cover */
.cover .content{width:min(640px,calc(100% - 48px))}
.cover .title{font-size:clamp(60px,10vw,150px)}
.watch{position:relative;display:inline-flex;align-items:center;gap:12px;padding:18px 30px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:17px;color:#fff;
  background:var(--ink);box-shadow:0 18px 44px rgba(11,18,32,.25)}
.watch::before{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid rgba(31,79,216,.35);animation:ringpulse 2s infinite}
@keyframes ringpulse{0%{transform:scale(.96);opacity:1}100%{transform:scale(1.12);opacity:0}}
.route{font-size:13px;color:var(--muted);letter-spacing:.08em;margin-top:26px}
.route b{color:var(--ink);font-weight:600}

/* finale */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chips>*{display:inline-flex;gap:8px;align-items:center;padding:11px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 8px 22px rgba(11,18,32,.06)}
.chips a:hover{border-color:var(--accent);color:var(--accent)}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(31,79,216,.32)}

/* ---------- visuals ---------- */
.hbar{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:12px;margin:12px 0}
.hbar .k{font-size:13px;color:var(--muted)}
.hbar .t{height:22px;border-radius:11px;background:var(--card2);overflow:hidden}
.hbar .f{height:100%;width:0;border-radius:11px;transition:width 1.4s var(--ease)}
.hbar .v{font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.grp{margin-bottom:14px}.grp>.gl{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}
.dots{display:grid;gap:6px}
.dots i{aspect-ratio:1;border-radius:5px;background:var(--line);transition:background .35s}
.mini{font-size:14px;color:var(--muted);margin-top:14px}.mini b{color:var(--ink)}
.plants{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pl{background:var(--card2);border-radius:16px;padding:14px 6px;text-align:center}
.pl .id{font-family:var(--serif);font-size:40px;line-height:1}
.pl .hp{font-size:11px;color:var(--soft);margin:2px 0 10px}
.pl .fd{width:18px;height:18px;border-radius:6px;margin:6px auto;border:2px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}
.mat{display:grid;grid-template-columns:86px repeat(4,1fr);gap:4px;font-size:11px;color:var(--soft)}
.mat .c{height:17px;border-radius:4px;background:var(--line);transition:background .3s}
.mat .h{text-align:center}
.tabs{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,18,32,.1)}
.heat{display:grid;grid-template-columns:34px repeat(4,1fr);gap:6px}
.heat .h{font-size:11px;color:var(--soft);text-align:center}
.heat .p{font-family:var(--serif);font-size:24px;display:flex;align-items:center}
.heat .c{border-radius:10px;height:42px;display:grid;place-items:center;font-weight:700;font-size:13px;transition:background .5s}
svg.chart{width:100%;height:auto;overflow:visible}
.ax{font:11px Inter,sans-serif;fill:var(--soft)}
.lims{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lim{background:var(--card2);border-radius:16px;padding:16px}
.lim b{display:block;font-size:14px;margin-bottom:2px}.lim span{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .hbar{grid-template-columns:60px 1fr 54px;margin:7px 0}.hbar .t{height:16px}
  .pl .id{font-size:28px}.pl .fd{width:14px;height:14px;margin:4px auto}
  .heat .c{height:30px;font-size:11px}.heat .p{font-size:18px}
  .mat .c{height:10px}.mat{grid-template-columns:70px repeat(4,1fr);font-size:10px}
  .lim{padding:10px}
}

/* ---------- HUD ---------- */
.bars{position:fixed;z-index:3;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;gap:5px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(11,18,32,.12);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ink);border-radius:3px}
.seg.done i{width:100%}
.seg.cur i{animation:fillbar var(--dur) linear forwards}
body.paused .seg.cur i{animation-play-state:paused}
@keyframes fillbar{from{width:0}to{width:100%}}
.meta{position:fixed;z-index:3;top:calc(26px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font-weight:800;letter-spacing:.26em;font-size:11px}
.meta .fl{font-size:11px;color:var(--muted);letter-spacing:.08em}
@media (max-width:820px){.meta{display:none}}
.hud{position:fixed;z-index:3;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  padding:6px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(11,18,32,.1);transition:opacity .6s}
.hud button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.hud button:hover{background:var(--card2)}
.hud #pp{background:var(--ink);color:#fff;font-size:14px}
.hud .count{white-space:nowrap;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 0 4px;font-variant-numeric:tabular-nums}
body.cover .hud{opacity:0;pointer-events:none}
.credit{position:fixed;z-index:3;right:12px;bottom:6px;font-size:10px;color:var(--muted);opacity:.7}
.credit a{text-decoration:none}

@media (prefers-reduced-motion:reduce){
  .slide,.slide.active{transition:opacity .3s}
  .slide.active .r,.slide.active .title .w,.slide.active .bigword,.slide.active .vis{animation-duration:.01s;animation-delay:0s}
  .watch::before,.flow{animation:none}
  #world .layer{transition:none}
}
</style>
</head>
<body class="cover paused">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4fd8"/><stop offset="1" stop-color="#5b45e0"/></linearGradient></defs></svg>

<video id="covervid" autoplay muted loop playsinline preload="auto" poster="video/hero-poster.jpg" aria-hidden="true">
  <source src="video/hero.webm" type="video/webm"><source src="video/hero.mp4" type="video/mp4"></video>
<div id="world"><div class="layer" id="far"></div><div class="layer" id="near"></div></div>
<div class="veil"></div>

<div id="stage"></div>
<div class="bars" id="bars"></div>
<div class="meta"><span class="logo">BEARING COLLECTIVE</span><span class="fl">Built on Flower</span></div>
<div class="hud">
  <button id="prev" aria-label="Previous">‹</button>
  <button id="pp" aria-label="Play or pause">▶</button>
  <button id="next" aria-label="Next">›</button>
  <span class="count" id="count">00 / 13</span>
</div>
<div class="credit">Data: <a href="https://engineering.case.edu/bearingdatacenter" target="_blank" rel="noopener">CWRU Bearing Data Center</a></div>

<script src="data.js"></script>
<script>
const D = window.DATA;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const M = ['Local-only', 'Federated', 'Personalized FL', 'Centralized'];
const ML = ['Alone', 'Flower', 'Personal', 'Pooled'];
const MC = ['var(--steel)', 'var(--accent)', '#7d94ee', 'var(--ink)'];
const pct = v => (v === 100 ? '100' : (Math.floor(v * 100) / 100).toFixed(2)) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const raf2 = f => requestAnimationFrame(() => requestAnimationFrame(f));

const ICONS = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  chart: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/>',
  split: '<path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="8"/>',
  scale: '<path d="M3 20h18M6 16V9M11 16V5M16 16v-4"/>'
};

/* ---------- visual builders: each returns {html, play(el)} ---------- */
function hbars(rows, max = 100) {
  return rows.map(([k, v, c, lab]) => `<div class="hbar"><span class="k">${k}</span><div class="t"><div class="f" data-w="${(v / max * 100).toFixed(2)}" style="background:${c}"></div></div><span class="v" style="color:${c === 'var(--steel)' ? 'var(--muted)' : c}">${lab ?? pct(v)}</span></div>`).join('');
}
function playBars(el) {
  el.querySelectorAll('.f').forEach(f => { f.style.transition = 'none'; f.style.width = 0; });
  raf2(() => el.querySelectorAll('.f').forEach((f, i) => { f.style.transition = `width 1.4s var(--ease) ${.6 + i * .12}s`; f.style.width = f.dataset.w + '%'; }));
}
function lineSVG({ w, h, pad, xs, series, ymin, ymax, yticks, xticks, xlab, ylog, ref }) {
  const yf = v => ylog ? Math.log10(v) : v;
  const X = v => pad.l + (v - xs[0]) / (xs[xs.length - 1] - xs[0]) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (yf(v) - yf(ymin)) / (yf(ymax) - yf(ymin)) * (h - pad.t - pad.b);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">`;
  yticks.forEach(([v, l]) => s += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text class="ax" x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end">${l}</text>`);
  (xticks || xs).forEach(v => s += `<text class="ax" x="${X(v)}" y="${h - pad.b + 18}" text-anchor="middle">${v}</text>`);
  if (xlab) s += `<text class="ax" x="${w - pad.r}" y="${h - 2}" text-anchor="end">${xlab}</text>`;
  if (ref) s += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(ref.v)}" y2="${Y(ref.v)}" stroke="var(--steel)" stroke-width="2" stroke-dasharray="6 6"/><text class="ax" x="${w - pad.r}" y="${Y(ref.v) - 8}" text-anchor="end">${ref.label}</text>`;
  series.forEach(({ ys, color, width = 3, area }) => {
    const d = ys.map((v, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    if (area) s += `<path d="${d} L${X(xs[xs.length - 1])},${h - pad.b} L${X(xs[0])},${h - pad.b} Z" fill="${color}" opacity=".08"/>`;
    s += `<path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  return s + '</svg>';
}
function playLines(el) {
  el.querySelectorAll('path.draw').forEach((p, i) => {
    const L = p.getTotalLength();
    p.style.transition = 'none'; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    raf2(() => { p.style.transition = `stroke-dashoffset 2.2s cubic-bezier(.3,.7,.2,1) ${.6 + i * .15}s`; p.style.strokeDashoffset = 0; });
  });
}
function dotsHTML(n, cols) { return `<div class="dots" style="grid-template-columns:repeat(${cols},1fr)">${'<i></i>'.repeat(n)}</div>`; }
function playDots(el, before, after) {
  const cells = [...el.querySelectorAll('.dots i')];
  cells.forEach((c, i) => c.style.background = i < before ? 'var(--steel)' : 'var(--line)');
  // fill left → right, column by column
  const cols = parseInt(el.querySelector('.dots').style.gridTemplateColumns.match(/\d+/)[0]);
  const order = cells.map((c, i) => [i, (i % cols) * 100 + Math.floor(i / cols)]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  let k = 0;
  setTimeout(() => order.forEach(i => { if (i < after) setTimeout(() => cells[i].style.background = 'var(--accent)', (k++) * 55); }), 1300);
}

const FAULTS = [['Normal', 'var(--good)'], ['Inner race', 'var(--accent)'], ['Outer race', 'var(--amber)'], ['Ball', 'var(--ink)']];
const PLANTS = [['A', '0 HP', [1, 1, 0, 1]], ['B', '1 HP', [1, 1, 1, 0]], ['C', '2 HP', [1, 0, 0, 1]], ['D', '3 HP', [1, 0, 1, 0]], ['E', 'new', [1, 0, 0, 0]]];

const V = {
  plants: {
    html: `<div class="plants">${PLANTS.map(([id, hp, has]) => `<div class="pl"><div class="id">${id}</div><div class="hp">${hp}</div>${has.map((h, j) => `<div class="fd" data-c="${h ? FAULTS[j][1] : ''}"></div>`).join('')}</div>`).join('')}</div>
      <div class="legend">${FAULTS.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}<span><i style="border:2px solid var(--line)"></i>never seen</span></div>`,
    play(el) {
      const fds = [...el.querySelectorAll('.fd')];
      fds.forEach(f => { f.style.background = 'transparent'; f.style.borderColor = 'var(--line)'; f.style.transition = 'none'; });
      // reveal plant by plant, left → right
      raf2(() => fds.forEach((f, i) => { if (!f.dataset.c) return; const col = Math.floor(i / 4); f.style.transition = `background .4s ${.7 + col * .25 + (i % 4) * .06}s, border-color .4s ${.7 + col * .25}s`; f.style.background = f.dataset.c; f.style.borderColor = f.dataset.c; }));
    }
  },
  data: (() => {
    const rows = ['Normal', 'Inner .007', 'Inner .014', 'Inner .021', 'Outer .007', 'Outer .014', 'Outer .021', 'Ball .007', 'Ball .014', 'Ball .021'];
    let h = '<div class="mat"><span></span>' + ['0 HP', '1 HP', '2 HP', '3 HP'].map(x => `<span class="h">${x}</span>`).join('');
    rows.forEach(r => { h += `<span>${r}</span>` + [0, 1, 2, 3].map(c => `<i class="c" data-col="${c}" data-held="${r.endsWith('.021') ? 1 : ''}"></i>`).join(''); });
    h += '</div><div class="legend"><span><i style="background:var(--accent)"></i>train / test</span><span><i style="background:var(--amber)"></i>.021″ held back for the unseen-size test</span></div>';
    return { html: h, play(el) {
      const cs = [...el.querySelectorAll('.c')];
      cs.forEach(c => { c.style.transition = 'none'; c.style.background = 'var(--line)'; });
      raf2(() => cs.forEach(c => { c.style.transition = `background .35s ${.6 + (+c.dataset.col) * .35 + Math.random() * .2}s`; c.style.background = c.dataset.held ? 'var(--amber)' : 'var(--accent)'; }));
    } };
  })(),
  share: (() => {
    const c = D.comm, raw = c.centralized_unique_raw_bytes_float32, fl = c.total_fl_model_payload_bytes;
    let s = '<svg class="chart" viewBox="0 0 520 210">';
    const pts = [[60, 50], [60, 160], [460, 50], [460, 160]], C = [260, 105];
    pts.forEach(([x, y], i) => {
      s += `<line x1="${x}" y1="${y}" x2="${C[0]}" y2="${C[1]}" stroke="#c9d6fa" stroke-width="2" stroke-dasharray="4 6"/>`;
      s += `<circle r="6" fill="var(--accent)"><animateMotion dur="2.4s" repeatCount="indefinite" begin="${i * .6}s" path="M${x},${y} L${C[0]},${C[1]}"/></circle>`;
      s += `<circle r="5" fill="#7d94ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="${1.2 + i * .6}s" path="M${C[0]},${C[1]} L${x},${y}"/></circle>`;
      s += `<rect x="${x - 38}" y="${y - 24}" width="76" height="48" rx="14" fill="#fff" stroke="var(--line)"/><text x="${x}" y="${y + 9}" text-anchor="middle" font-family="Instrument Serif" font-size="28" fill="var(--ink)">${'ABCD'[i]}</text>`;
    });
    s += `<circle cx="${C[0]}" cy="${C[1]}" r="44" fill="var(--accent)" opacity=".08"/><circle cx="${C[0]}" cy="${C[1]}" r="30" fill="var(--accent)"/><text x="${C[0]}" y="${C[1] + 5}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter">Flower</text></svg>`;
    return { html: s + `<div style="margin-top:10px">${hbars([['Raw data', 100, 'var(--steel)', (raw / 1e6).toFixed(2) + ' MB'], ['Updates', fl / raw * 100, 'var(--accent)', (fl / 1e6).toFixed(2) + ' MB']])}</div><div class="cap">Measured: all 30 rounds of model traffic vs. one upload of the raw training signal.</div>`, play: playBars };
  })(),
  curve: (() => {
    const ys = D.scenarios.baseline.fl_curve, xs = ys.map((_, i) => i + 1), loc = D.scenarios.baseline.members['Local-only'];
    return { html: `<h4>Shared-model accuracy · plants A–D</h4>` + lineSVG({ w: 540, h: 280, pad: { l: 44, r: 10, t: 14, b: 34 }, xs, xticks: [1, 5, 10, 15, 20, 25, 30], xlab: 'round',
      series: [{ ys, color: 'var(--accent)', width: 4, area: true }], ymin: 40, ymax: 100, yticks: [[40, '40%'], [60, '60%'], [80, '80%'], [100, '100%']], ref: { v: loc, label: 'each plant alone · ' + pct(loc) } }) + `<div class="cap">Round 1: ${pct(ys[0])} · Round 4: ${pct(ys[3])} · mean of five seeds</div>`, play: playLines };
  })(),
  result: { html: `<h4>Baseline test · average of plants A–D</h4>` + hbars(M.map((m, i) => [ML[i], D.scenarios.baseline.members[m], MC[i]])) + `<div class="cap">Five seeds, identical scores every time.</div>`, play: playBars },
  plantC: { html: `<h4>Plant C · outer-race fault windows</h4>${dotsHTML(14, 7)}<div class="mini">Alone <b>0 / 14</b> → with Flower <b style="color:var(--accent)">14 / 14</b></div>`, play: el => playDots(el, 0, 14) },
  plantE: { html: `<h4>Plant E · four-class test on day one</h4>${dotsHTML(32, 8)}<div class="mini">Alone <b>8 / 32</b> → with Flower <b style="color:var(--accent)">32 / 32</b></div>`, play: el => playDots(el, 8, 32) },
  heat: (() => {
    const keys = Object.keys(D.scenarios);
    const color = v => `color-mix(in srgb, var(--accent) ${Math.round(Math.max(0, Math.min(1, (v - 20) / 80)) * 100)}%, #fff)`;
    const grid = k => { const s = D.scenarios[k]; let h = '<span></span>' + ML.map(x => `<span class="h">${x}</span>`).join('');
      for (const p of 'ABCDE') h += `<span class="p">${p}</span>` + M.map(m => { const v = s.plants[p][m]; return `<span class="c" style="background:${color(v)};color:${v > 62 ? '#fff' : 'var(--ink)'}">${pct(v)}</span>`; }).join('');
      return h; };
    return { html: `<div class="tabs">${keys.map((k, i) => `<button data-k="${k}" class="${i ? '' : 'on'}">${D.scenarios[k].label}</button>`).join('')}</div><div class="heat">${grid(keys[0])}</div><div class="cap">Accuracy per plant · mean of five seeds · tap a test</div>`,
      play(el) {
        const tabs = el.querySelector('.tabs');
        if (!tabs.dataset.wired) { tabs.dataset.wired = 1; tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); [...tabs.children].forEach(x => x.classList.toggle('on', x === b)); el.querySelector('.heat').innerHTML = grid(b.dataset.k); setPlaying(false); }); }
        // auto-cycle the three tests while the slide plays
        clearInterval(this.t); let i = 0;
        const show = () => { const b = tabs.children[i % keys.length]; [...tabs.children].forEach(x => x.classList.toggle('on', x === b)); el.querySelector('.heat').innerHTML = grid(b.dataset.k); i++; };
        show(); this.t = setInterval(() => { if (playing && S[cur].vis === 'heat') show(); else clearInterval(this.t); }, 5000);
      } };
  })(),
  noise: (() => {
    const sw = D.sweep, xs = sw.map(r => r.snr);
    return { html: `<h4>Accuracy vs. sensor noise</h4>` + lineSVG({ w: 540, h: 260, pad: { l: 44, r: 10, t: 14, b: 34 }, xs, xlab: 'SNR, dB (left = noisier)',
      series: M.map((m, i) => ({ ys: sw.map(r => r[m]), color: MC[i], width: i === 1 ? 4 : 2.5 })), ymin: 50, ymax: 102, yticks: [[50, '50%'], [75, '75%'], [100, '100%']] })
      + `<div class="legend">${M.map((m, i) => `<span><i style="background:${MC[i]}"></i>${ML[i]}</span>`).join('')}</div>`, play: playLines };
  })(),
  fail: { html: `<h4>Unseen fault size (.021″) · average of plants A–D</h4>` + hbars(M.map((m, i) => [ML[i], D.scenarios.unseen_severity.members[m], ['var(--steel)', 'var(--amber)', '#efa462', 'var(--ink)'][i]])) + `<div class="mini">Plant C outer-race hits: <b>0 / 350</b> with every method.</div>`, play: playBars },
  prox: (() => {
    const g = Object.entries(D.fedprox).map(([k, f]) => `<div class="grp"><div class="gl">${D.scenarios[k].label}</div>${hbars([['FedAvg', f.fedavg, 'var(--accent)'], ['FedProx', f.fedprox, '#7d94ee']])}</div>`).join('');
    return { html: g + `<div class="cap">μ = 0.1 fixed before the runs · five seeds each</div>`, play: playBars };
  })(),
  scale: (() => {
    const p = D.proj;
    return { html: `<h4>Cumulative bytes over 30 days · log scale</h4>` + lineSVG({ w: 540, h: 270, pad: { l: 54, r: 10, t: 14, b: 34 }, xs: p.days, xticks: [1, 10, 20, 30], xlab: 'day', ylog: true,
      series: [{ ys: p.raw_cumulative_bytes, color: 'var(--steel)', width: 4 }, { ys: p.fl_cumulative_bytes, color: 'var(--accent)', width: 4 }], ymin: 1e4, ymax: 1e14,
      yticks: [[1e4, '10 KB'], [1e6, '1 MB'], [1e9, '1 GB'], [1e12, '1 TB'], [1e14, '100 TB']] })
      + `<div class="legend"><span><i style="background:var(--steel)"></i>Raw stream · 31.1 TB</span><span><i style="background:var(--accent)"></i>Model updates · 0.56 MB</span></div><div class="cap">Projection: 5 plants × 50 sensors × 12 kHz, 1 round a day. Not measured.</div>`, play: playLines };
  })(),
  limits: { html: `<div class="lims">${[['One lab rig', 'Not independent machines'], ['Seeded damage', 'Not natural wear'], ['No field pilot', 'No warning-time claims'], ['No formal privacy', 'No secure aggregation or DP']].map(([b, s]) => `<div class="lim"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`, play() {} }
};

/* ---------- story ---------- */
const S = [
  { type: 'cover' },
  { ch: 'Chapter 01', tag: 'The gap', big: 'Gap', img: 'img/02_maintenance.jpg', title: 'Every plant has blind spots', line: 'Each site has seen only some kinds of bearing failure.', vis: 'plants', stat: { n: 5, label: 'plants, each missing faults' } },
  { ch: 'Chapter 02', tag: 'The data', big: 'CWRU', img: 'img/05_lab.jpg', title: 'Real vibration, one lab rig', line: 'Case Western Reserve University bearing recordings, 12 kHz.', vis: 'data', stat: { n: 40, label: 'official recordings, fingerprinted' } },
  { ch: 'Chapter 03', tag: 'The idea', big: 'Flower', img: 'img/04_sites.jpg', title: 'Share the lesson, keep the data', line: 'Plants send model weights. Raw signals never leave.', vis: 'share', stat: { n: 69, pre: '−', suf: '%', label: 'traffic vs. uploading the raw data' } },
  { ch: 'Chapter 04', tag: 'Learning', big: 'Rounds', icon: 'chart', title: 'A coin flip to near-perfect', line: 'Thirty Flower rounds, five seeds.', vis: 'curve', stat: { n: 4, label: 'rounds to reach 98.8%' } },
  { ch: 'Chapter 05', tag: 'The result', big: '100%', img: 'img/09_team.jpg', title: 'Together, nothing missed', line: 'Average plant accuracy on the baseline test.', vis: 'result', stat: { from: 62.5, n: 100, dec: 0, suf: '%', label: 'up from 62.5% alone' } },
  { ch: 'Chapter 06', tag: 'Plant C', big: 'Plant C', img: 'img/03_bearing.jpg', title: 'A fault it never saw', line: 'Plant C had no outer-race examples of its own.', vis: 'plantC', stat: { n: 14, suf: ' / 14', label: 'outer-race windows caught' } },
  { ch: 'Chapter 07', tag: 'Plant E', big: 'Plant E', img: 'img/07_inspection.jpg', title: 'New plant, expert on day one', line: 'Joined with healthy data only. Downloads the shared model.', vis: 'plantE', stat: { from: 8, n: 32, suf: ' / 32', label: 'correct, up from 8 alone' } },
  { ch: 'Chapter 08', tag: 'Every number', big: 'Grid', icon: 'grid', title: 'Every plant, every test', line: 'Three tests, four ways to train.', vis: 'heat', dur: 18, stat: { n: 60, label: 'results, five seeds each' } },
  { ch: 'Chapter 09', tag: 'Noise', big: 'Noise', img: 'img/08_sensor.jpg', title: 'Static does not shake it', line: 'Retrained at six noise levels.', vis: 'noise', stat: { from: 56.4, n: 98.9, dec: 1, suf: '%', label: 'at 0 dB, the noisiest, vs. 56.4% alone' } },
  { ch: 'Chapter 10', tag: 'Where it breaks', big: 'Unseen', img: 'img/06_damage.jpg', title: 'A larger fault goes unseen', warn: true, line: 'Train on small faults, test on a larger size. Every method fails.', vis: 'fail', stat: { from: 100, n: 36.5, dec: 1, suf: '%', label: 'accuracy · reported, not hidden' } },
  { ch: 'Chapter 11', tag: 'Smarter algorithm?', big: 'FedProx', icon: 'split', title: 'FedProx: no gain', line: 'Same data, same seeds, one extra term.', vis: 'prox', stat: { n: 0, suf: ' pts', label: 'accuracy gained over FedAvg' } },
  { ch: 'Chapter 12', tag: 'At scale', big: '30 days', icon: 'scale', title: 'Terabytes versus megabytes', line: 'Thirty days, five plants, fifty sensors each.', vis: 'scale', stat: { n: 31.1, dec: 1, suf: ' TB', label: 'raw vs. 0.56 MB of updates (projection)' } },
  { ch: 'Finale', tag: 'Honest limits', big: 'Limits', icon: 'grid', title: 'What it does not prove', line: 'A lab result, not a field result.', vis: 'limits', finale: true }
];
const LAST = S.length - 1;
let cur = 0, playing = false;

function titleHTML(t, warn) {
  const w = t.split(' ');
  return w.map((x, i) => `<span class="w${i === w.length - 1 ? ' acc' + (warn ? ' warn' : '') : ''}" style="--i:${i}">${esc(x)}</span>`).join('');
}
function buildSlides() {
  const stage = $('#stage'), bars = $('#bars');
  S.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide' + (s.type === 'cover' ? ' cover' : '');
    if (s.type === 'cover') {
      el.innerHTML = `<div class="content">
        <div class="ch r" style="--d:1">A story in twelve chapters</div>
        <h1 class="title">${titleHTML('Bearing Collective')}</h1>
        <p class="line r" style="--d:4">Five plants learn bearing faults together, without sharing their data.</p>
        <button class="watch r" style="--d:5" id="watch">▶&nbsp; Watch the story</button>
        <div class="route r" style="--d:7"><b>A</b> → <b>B</b> → <b>C</b> → <b>D</b> → <b>E</b> → <b>Flower</b></div></div>`;
    } else {
      const art = s.img ? `<img src="${s.img}" alt="">` : `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon] || ''}</svg>`;
      const stat = s.stat ? `<div class="stat r" style="--d:6"><b>${esc((s.stat.pre || '') + (s.stat.from ?? 0) + (s.stat.suf || ''))}</b><span>${esc(s.stat.label)}</span></div>` : '';
      const fin = s.finale ? `<div class="chips r" style="--d:6"><a href="https://engineering.case.edu/bearingdatacenter" target="_blank" rel="noopener">CWRU data ↗</a><a href="https://flower.ai" target="_blank" rel="noopener">Flower ↗</a></div><button class="cta r" style="--d:7" data-replay>↺ Watch again</button>` : '';
      el.innerHTML = `<div class="bigword">${esc(s.big)}</div>
        <div class="content"><div class="art r" style="--d:0">${art}</div>
          <div class="ch r" style="--d:1">${esc(s.ch)} <em>· ${esc(s.tag)}</em></div>
          <h2 class="title">${titleHTML(s.title, s.warn)}</h2>
          <p class="line r" style="--d:5">${esc(s.line)}</p>${stat}${fin}</div>
        <div class="vis">${V[s.vis].html}</div>`;
    }
    stage.appendChild(el); s.el = el;
    const seg = document.createElement('div'); seg.className = 'seg'; if (s.dur) seg.style.setProperty('--dur', s.dur + 's');
    const fill = document.createElement('i');
    fill.addEventListener('animationend', () => { if (i === cur && playing) next(); });
    seg.appendChild(fill); bars.appendChild(seg); s.seg = seg;
  });
}

/* ---------- panorama: a long horizontal world the camera pans across ---------- */
const WORLD = 3.2;   // world width in viewport widths
function buildWorld() {
  const W = 3200, H = 1000;
  // far layer: engineering grid + faint ticks
  let far = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">`;
  for (let x = 0; x <= W; x += 50) far += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="rgba(11,18,32,${x % 250 ? .035 : .07})"/>`;
  for (let y = 0; y <= H; y += 50) far += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="rgba(11,18,32,${y % 250 ? .035 : .07})"/>`;
  far += '</svg>';
  // near layer: flowing vibration trace, plants A–E, and the Flower hub at the far right
  const wave = (y0, amp, k) => { let d = ''; for (let x = -300; x <= W + 300; x += 4) {
      const u = x / 300; let y = Math.sin(u * Math.PI * 2 * 2 + k) * .5 + Math.sin(u * Math.PI * 2 * 5 + k * 2) * .25 + Math.sin(u * Math.PI * 2 * 13) * .1;
      const ph = ((x % 300) + 300) % 300; if (ph < 26) y += Math.exp(-ph / 6) * Math.sin(ph * 1.4) * 2.2;
      d += (d ? 'L' : 'M') + x + ',' + (y0 + y * amp).toFixed(1); } return d; };
  let near = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><g class="flow">
    <path d="${wave(610, 46, 0)}" fill="none" stroke="rgba(31,79,216,.3)" stroke-width="2.2"/>
    <path d="${wave(645, 30, 1.3)}" fill="none" stroke="rgba(31,79,216,.2)" stroke-width="1.6"/>
    <path d="${wave(675, 18, 2.1)}" fill="none" stroke="rgba(31,79,216,.12)" stroke-width="1.2"/></g>`;
  const hub = [2900, 420], P = [[560, 300], [980, 470], [1400, 290], [1820, 480], [2240, 310]];
  P.forEach(([x, y], i) => {
    near += `<path d="M${x},${y} Q${(x + hub[0]) / 2},${y - 160} ${hub[0]},${hub[1]}" fill="none" stroke="rgba(31,79,216,.16)" stroke-width="2" stroke-dasharray="4 8"/>`;
    near += `<circle r="7" fill="rgba(31,79,216,.85)"><animateMotion dur="4s" repeatCount="indefinite" begin="${i * .7}s" path="M${x},${y} Q${(x + hub[0]) / 2},${y - 160} ${hub[0]},${hub[1]}"/></circle>`;
    near += `<g transform="translate(${x},${y})" opacity=".8"><rect x="-32" y="-32" width="64" height="64" rx="18" fill="#fff" stroke="rgba(31,79,216,.18)" stroke-width="2"/>
      <text y="12" text-anchor="middle" font-family="Instrument Serif" font-size="38" fill="#0b1220">${'ABCDE'[i]}</text></g>`;
  });
  near += `<circle cx="${hub[0]}" cy="${hub[1]}" r="120" fill="rgba(31,79,216,.06)"/><circle cx="${hub[0]}" cy="${hub[1]}" r="74" fill="#1f4fd8"/>`;
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; near += `<ellipse cx="${hub[0] + Math.cos(a) * 26}" cy="${hub[1] + Math.sin(a) * 26}" rx="22" ry="11" transform="rotate(${k * 60} ${hub[0] + Math.cos(a) * 26} ${hub[1] + Math.sin(a) * 26})" fill="rgba(255,255,255,.9)"/>`; }
  near += `<circle cx="${hub[0]}" cy="${hub[1]}" r="11" fill="#fff"/></svg>`;
  $('#far').innerHTML = far; $('#near').innerHTML = near;
  sizeWorld();
}
function sizeWorld() {
  $('#far').style.width = (innerWidth * (1 + (WORLD - 1) * .5)) + 'px';
  $('#near').style.width = (innerWidth * WORLD) + 'px';
}
function panWorld(i) {
  const k = i <= 1 ? 0 : (i - 1) / (LAST - 1);           // 0 → 1 across the story
  const span = innerWidth * (WORLD - 1);
  $('#near').style.transform = `translateX(${-k * span}px)`;
  $('#far').style.transform = `translateX(${-k * span * .5}px)`; // parallax
}

/* ---------- counters ---------- */
function countUp(i) {
  const s = S[i]; if (!s.stat) return;
  const el = s.el.querySelector('.stat b');
  const { from = 0, n, pre = '', suf = '', dec = 0 } = s.stat;
  const fmt = v => pre + v.toFixed(dec) + suf;
  el.textContent = fmt(from);
  setTimeout(() => {
    const t0 = performance.now(), dur = 1600;
    const f = now => { if (cur !== i) return; const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (n - from) * e); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }, 900);
}

/* ---------- navigation ---------- */
function setPlaying(v) { playing = v; document.body.classList.toggle('paused', !v); $('#pp').textContent = v ? '❚❚' : '▶'; }
function go(i) {
  i = Math.max(0, Math.min(LAST, i)); cur = i;
  S.forEach((s, k) => { s.el.classList.toggle('active', k === i); s.el.classList.toggle('past', k < i); s.seg.className = 'seg' + (k < i ? ' done' : ''); });
  void S[i].seg.offsetWidth; S[i].seg.classList.add('cur');
  document.body.classList.toggle('cover', i === 0);
  $('#count').textContent = String(i).padStart(2, '0') + ' / ' + String(LAST).padStart(2, '0');
  panWorld(i); countUp(i);
  if (S[i].vis) V[S[i].vis].play(S[i].el.querySelector('.vis'));
}
function next() { if (cur < LAST) go(cur + 1); else setPlaying(false); }
function prev() { if (cur > 1) go(cur - 1); }
function start() { setPlaying(true); go(1); }

/* ---------- input: tap, swipe, keys ---------- */
let sx = null, sy = 0;
$('#stage').addEventListener('pointerdown', e => { if (e.target.closest('button,a')) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
$('#stage').addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (cur === 0) { start(); return; }
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { e.clientX < innerWidth * .3 ? prev() : next(); }
});
$('#stage').addEventListener('click', e => { if (e.target.closest('[data-replay]') || e.target.closest('#watch')) start(); });
$('#prev').onclick = prev;
$('#next').onclick = () => { cur === 0 ? start() : next(); };
$('#pp').onclick = () => { cur === 0 ? start() : setPlaying(!playing); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') cur === 0 ? start() : next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); cur === 0 ? start() : setPlaying(!playing); }
});
// horizontal trackpad / wheel moves the story sideways
let wheelLock = 0;
addEventListener('wheel', e => {
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) < 30 || performance.now() < wheelLock) return;
  wheelLock = performance.now() + 900;
  d > 0 ? (cur === 0 ? start() : next()) : prev();
}, { passive: true });
addEventListener('resize', () => { sizeWorld(); panWorld(cur); });

/* ---------- boot ---------- */
buildSlides(); buildWorld(); go(0);
if (matchMedia('(prefers-reduced-motion: reduce)').matches) $('#covervid').pause();
</script>
